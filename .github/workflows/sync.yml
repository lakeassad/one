name: Bulk Sync Docker Images
on:
  push:
    paths:
      - 'images.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull and push images
        timeout-minutes: 120 # 防止大镜像同步超时
        env:
          REG: ${{ secrets.ALIYUN_REGISTRY }}
          NS: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac
            
            src="$line"
            # 将源地址的 / 替换为 __ 防止 ACR 仓库路径冲突
            rel="${src#*//}" 
            flat="$(echo "$rel" | sed 's#/#__#g')"
            dst="$REG/$NS/$flat"
            
            echo ">> [START] Syncing $src -> $dst"
            if docker pull $src; then
              docker tag $src $dst
              docker push $dst
              echo ">> [SUCCESS] $src synced!"
            else
              echo "!! [FAILED] Pull failed for $src"
            fi
          done < images.txt
