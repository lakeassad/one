- name: Pull and push images to github-hub
        timeout-minutes: 120
        env:
          REG: ${{ secrets.ALIYUN_REGISTRY }}
          NS: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac
            
            src="$line"
            # 提取最后一段并替换冒号为短横线，生成合法且易读的 tag
            tag="${src##*/}"
            tag="${tag//:/'-'}"
            dst="$REG/$NS/github-hub:$tag"
            
            echo ">> [START] Syncing $src -> $dst"
            if docker pull $src; then
              docker tag $src $dst
              docker push $dst
              echo ">> [SUCCESS] $src synced!"
            else
              echo "!! [FAILED] Pull failed for $src"
            fi
          done < images.txt
