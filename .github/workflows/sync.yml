name: Bulk Sync Docker Images
on:
  push:
    paths:
      - 'images.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull and push images to github-hub
        timeout-minutes: 300
        env:
          REG: ${{ secrets.ALIYUN_REGISTRY }}
          NS: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac
            
            src="$line"
            # 提取最后一段并替换冒号为短横线，生成合法 tag
            tag="${src##*/}"
            tag="${tag//:/'-'}"
            dst="$REG/$NS/github-hub:$tag"
            
            echo ">> [START] Checking $src -> $dst"
            
            # ✅ 新增：检查阿里云 ACR 是否已有该镜像（利用 docker manifest inspect 探测远程仓库）
            if docker manifest inspect "$dst" > /dev/null 2>&1; then
              echo "✅ $dst 已存在于 ACR，跳过本次同步！"
              echo "-----------------------------------"
              continue
            fi
            
            echo "⏳ $dst 不存在于 ACR，开始同步..."
            
            # 增加单镜像超时(10分钟)和重试机制(最多3次)
            success=0
            for i in 1 2 3; do
              echo "Attempt $i to pull $src..."
              if timeout 600 docker pull $src; then
                docker tag $src $dst
                docker push $dst
                echo ">> [SUCCESS] $src synced!"
                success=1
                break
              else
                echo "!! [FAILED] Pull/Push failed for $src, retrying..."
                sleep 5
              fi
            done
            
            if [ $success -eq 0 ]; then
              echo "!! [ERROR] Failed to sync $src after 3 attempts, skipping."
            fi
            echo "-----------------------------------"
          done < images.txt
